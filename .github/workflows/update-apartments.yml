name: Обновить квартиры
# Запуск с телефона: GitHub → Actions → «Обновить квартиры» → Run workflow.
# Автоматически каждый день в 08:00 по Бишкеку (02:00 UTC).
# GitHub Actions может запускать задания с задержкой относительно расписания.
on:
  push:
    branches: [main]
    paths: ['export/projects.py', 'export/project-terms.json', 'export/export.py']
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: apartments-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first-deploy.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить браузер
        run: |
          pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Выгрузить квартиры из базы
        env:
          BASE_EMAIL: ${{ secrets.BASE_EMAIL }}
          BASE_PASSWORD: ${{ secrets.BASE_PASSWORD }}
        run: python -X utf8 export/export.py --ci
      - name: Сохранить изменения
        run: |
          git config user.name "oshcity-bot"
          git config user.email "oshcity-bot@users.noreply.github.com"
          git add -A site/data site/kv
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Обновление квартир $(TZ=Asia/Bishkek date +%d.%m.%Y)"
          # при сбоях GitHub push иногда отвечает 500 — пробуем ещё раз с паузой
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push && exit 0
            echo "Попытка $i не удалась, жду $((i * 30)) сек"; sleep $((i * 30))
          done
          # сайт всё равно обновим ниже, а в репозиторий данные попадут при следующем запуске
          echo "::warning::Не удалось сохранить данные в репозиторий (сбой GitHub), сайт обновляется без сохранения"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: first-deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Подождать доступности файлов публикации
        if: steps.first-deploy.outcome == 'failure'
        run: sleep 20
      - id: deployment
        if: steps.first-deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
