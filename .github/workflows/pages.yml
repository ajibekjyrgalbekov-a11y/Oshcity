name: Публикация сайта
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first-deploy.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: first-deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Подождать доступности файлов публикации
        if: steps.first-deploy.outcome == 'failure'
        run: sleep 20
      - id: deployment
        if: steps.first-deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
